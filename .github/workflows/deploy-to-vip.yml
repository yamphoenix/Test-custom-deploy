name: Deploy to VIP

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VIP Develop Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install VIP-CLI
        run: npm install -g @automattic/vip

      - name: Verify VIP-CLI
        run: vip --version

      - name: Create deployment archive
        run: |
          # Create a single root directory
          mkdir -p app
          
          # Copy folders into the root directory
          [ -d "client-mu-plugins" ] && cp -r client-mu-plugins app/
          [ -d "plugins" ] && cp -r plugins app/
          [ -d "themes" ] && cp -r themes app/
          [ -d "vip-config" ] && cp -r vip-config app/
          
          # Create the archive with single root
          tar -czvf deploy.tar.gz app
          
          echo "Archive contents:"
          tar -tvf deploy.tar.gz

      - name: Validate deployment archive
        env:
          WPVIP_DEPLOY_TOKEN: ${{ secrets.VIP_DEPLOY_TOKEN }}
        run: |
          vip @yashita-test.develop app deploy validate deploy.tar.gz

      - name: Deploy to VIP
        env:
          WPVIP_DEPLOY_TOKEN: ${{ secrets.VIP_DEPLOY_TOKEN }}
        run: |
          vip @yashita-test.develop app deploy deploy.tar.gz \
            --message "Deploy: ${{ github.event.head_commit.message || 'Manual trigger' }}" \
            --force
