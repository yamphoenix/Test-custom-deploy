name: Deploy to VIP Develop Environment

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      SKIP_CHECKOUT:
        description: 'Skip the checkout step'
        required: false
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Check repo configuration"
        run: |
          if [ -n "${{ secrets.VIP_DEPLOY_TOKEN }}" ]; then
            echo "Repository has the secrets set."
          else
            echo "VIP_DEPLOY_TOKEN is not configured."
            echo "Save the deploy token as VIP_DEPLOY_TOKEN."
            exit 1
          fi
          
          DEPLOY_ENVIRONMENT="@yashita-test.develop"
          echo "DEPLOY_ENVIRONMENT=${DEPLOY_ENVIRONMENT}" >> $GITHUB_ENV
        shell: bash

      - name: Checkout Repository
        uses: actions/checkout@v4
        if: ${{ github.event.inputs.SKIP_CHECKOUT != 'true' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      

      - name: Install VIP CLI
        run: |
          npm install -g @automattic/vip
        shell: bash

      - name: Compress the repo
        run: |
          mkdir wrap_folder
          shopt -s extglob
          cp -r !(wrap_folder) wrap_folder/
          zip -r repo.zip wrap_folder
        shell: bash

      - name: Deploy via VIP-CLI
        run: |
          vip app deploy ${{ env.DEPLOY_ENVIRONMENT }} ./repo.zip --message "${{ github.event.head_commit.message }}" --force
        shell: bash
        env:
          VIP_DEPLOY_TOKEN: ${{ secrets.VIP_DEPLOY_TOKEN }}
