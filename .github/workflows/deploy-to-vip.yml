name: Deploy to VIP Develop Environment

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: Automattic/vip-actions/custom-deployment@trunk
        with:
          # GitHub secret that stores your Custom Deployment token
          WPVIP_DEPLOY_TOKEN: ${{ secrets.VIP_DEPLOY_TOKEN }}

          # VIP environment alias (confirm this matches your app/env)
          # Format: "@appslug.environment"
          ENVIRONMENT_ALIAS: "@yashita-test.develop"

          # Message shown in VIP deployment logs
          RELEASE_NAME: ${{ github.event.head_commit.message }}
